name: Desktop Browser Audit
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chrome availability
        run: google-chrome --version
      - name: Desktop layout and interaction checks
        run: node tests/desktop-smoke.cjs
      - name: Upload audit screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-audit-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
