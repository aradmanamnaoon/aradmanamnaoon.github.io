name: Desktop Browser Audit
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chrome availability
        run: |
          google-chrome --version
          npm ci
      - name: Desktop layout, motion and case-study checks
        run: npm run test:browser
      - name: Upload audit screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-audit-screenshots
          path: docs/qa/cinematic-headless-desktop.png
          if-no-files-found: ignore
