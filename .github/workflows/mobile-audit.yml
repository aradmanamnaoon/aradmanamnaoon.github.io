name: Mobile Browser Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies and verify browser availability
        run: |
          npm ci
          google-chrome --version
      - name: Test cinematic layouts, navigation and motion at phone/tablet widths
        run: npm run test:browser
      - name: Capture failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-failure
          path: docs/qa/cinematic-headless-mobile.png
          if-no-files-found: ignore
