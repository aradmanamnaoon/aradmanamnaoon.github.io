<text x="869" y="183" font-size="17" fill="#f0eafa">Psychology · Behavior</text><text x="869" y="215" font-size="17" fill="#f0eafa">Neuroscience · Cognition</text><text x="869" y="264" font-size="15" fill="#bdb0d4">Developing research focus</text>
<text x="55" y="332" font-size="14" fill="#a4bdc9">CONCEPTUAL FRAMEWORK · NOT EXPERIMENTAL EVIDENCE</text>
</g></svg>