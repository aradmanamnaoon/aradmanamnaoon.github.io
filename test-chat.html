<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Arad CV Chat Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;

      line-height: 1.6;

      background: #ffffff;
      color: #111111;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 24px;
    }

    #status {
      padding: 12px 16px;
      background: #f4f4f4;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    #progress {
      width: 100%;
      margin-bottom: 20px;
      display: none;
    }

    .chat {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
    }

    .answer {
      min-height: 100px;
      padding: 16px;
      background: #f7f7f7;
      border-radius: 10px;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;

      font: inherit;
      padding: 12px 14px;

      border: 1px solid #aaa;
      border-radius: 8px;
    }

    button {
      font: inherit;

      padding: 12px 18px;

      cursor: pointer;

      border: 1px solid #888;
      border-radius: 8px;

      background: #f4f4f4;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .examples {
      margin-top: 24px;
      font-size: 0.9rem;
      color: #666;
    }

    @media (max-width: 600px) {

      body {
        margin-top: 20px;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

  </style>

</head>


<body>

  <h1>Chat with Arad's CV</h1>

  <p class="description">
    Local browser-only RAG + WebLLM test.
  </p>


  <p id="status">
    AI not loaded yet.
  </p>


  <progress
    id="progress"
    max="1"
    value="0"
  ></progress>


  <div class="chat">

    <div
      id="answer"
      class="answer"
      aria-live="polite"
    >
      Click "Load AI" first.
    </div>


    <div class="controls">

      <input
        id="question"
        type="text"
        value="What experience does Arad have with medical imaging?"
        aria-label="Ask about Arad"
      />


      <button
        id="load"
        type="button"
      >
        Load AI
      </button>


      <button
        id="ask"
        type="button"
        disabled
      >
        Ask
      </button>

    </div>

  </div>


  <p class="examples">
    Try: medical imaging, Persian GPT, QLoRA,
    LangGraph, certifications, or phone number.
  </p>


  <script type="module">

    import {
      initializeCVChat,
      askCV,
      getCVChatStatus,
    } from "./assets/js/cv-chat-engine.js";


    const status =
      document.querySelector("#status");

    const progress =
      document.querySelector("#progress");

    const answer =
      document.querySelector("#answer");

    const question =
      document.querySelector("#question");

    const loadButton =
      document.querySelector("#load");

    const askButton =
      document.querySelector("#ask");


    function handleProgress(event) {

      console.log(
        "CV Chat progress:",
        event
      );

      status.textContent =
        event.message ??
        event.stage ??
        "Working...";


      if (
        typeof event.progress ===
        "number"
      ) {
        progress.style.display =
          "block";

        progress.value =
          Math.max(
            0,
            Math.min(
              1,
              event.progress
            )
          );
      }


      if (
        event.stage === "ready"
      ) {
        progress.style.display =
          "none";
      }
    }


    async function loadAI() {

      loadButton.disabled = true;
      askButton.disabled = true;

      answer.textContent =
        "Preparing the local AI model...";


      try {

        const info =
          await initializeCVChat({
            onProgress:
              handleProgress,
          });


        console.log(
          "CV Chat ready:",
          info
        );


        status.textContent =
          `Ready — ${info.model}`;

        answer.textContent =
          "Ready. Ask me something about Arad.";

        askButton.disabled =
          false;

        loadButton.textContent =
          "AI Loaded";

      } catch (error) {

        console.error(error);

        status.textContent =
          `Failed: ${error.message}`;

        answer.textContent =
          error.message;

        loadButton.disabled =
          false;
      }
    }


    async function askQuestion() {

      const text =
        question.value.trim();

      if (!text) {
        return;
      }


      askButton.disabled =
        true;

      question.disabled =
        true;

      answer.textContent =
        "Searching CV...";


      try {

        const result =
          await askCV(
            text,
            {
              onProgress:
                handleProgress,

              onToken:
                (answerSoFar) => {
                  // Safe rendering:
                  // no innerHTML.
                  answer.textContent =
                    answerSoFar;
                },
            }
          );


        console.log(
          "Final CV answer:",
          result
        );


        status.textContent =
          "Ready.";

      } catch (error) {

        console.error(error);

        answer.textContent =
          `Error: ${error.message}`;

        status.textContent =
          "Error.";

      } finally {

        askButton.disabled =
          false;

        question.disabled =
          false;

        question.focus();
      }
    }


    loadButton.addEventListener(
      "click",
      loadAI
    );


    askButton.addEventListener(
      "click",
      askQuestion
    );


    question.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !askButton.disabled
        ) {
          askQuestion();
        }
      }
    );


    // Helpful status check only.
    console.log(
      "Initial status:",
      getCVChatStatus()
    );

  </script>

</body>

</html>
