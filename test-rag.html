<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>CV RAG Retrieval Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #111;
      background: #fff;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #555;
      margin-top: 0;
      margin-bottom: 24px;
    }

    #status {
      padding: 12px 16px;
      border-radius: 10px;
      background: #f4f4f4;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    input,
    button {
      font: inherit;
      padding: 12px 14px;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    button {
      cursor: pointer;
      border: 1px solid #888;
      border-radius: 8px;
      background: #f4f4f4;
    }

    button:hover:not(:disabled) {
      background: #e8e8e8;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    h2 {
      margin-top: 30px;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    pre {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 16px;
      border-radius: 10px;
      overflow-wrap: anywhere;
      overflow-x: auto;
      min-height: 80px;
    }

    #context {
      background: #f8f8f8;
    }

    @media (max-width: 650px) {
      body {
        margin-top: 20px;
      }

      .search-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>CV RAG Retrieval Test</h1>

  <p class="description">
    Tests the local CV knowledge base, embeddings, vector search,
    and retrieved context before connecting the LLM.
  </p>

  <p id="status">Not initialized.</p>

  <div class="search-row">
    <input
      id="question"
      type="text"
      value="What experience does Arad have with medical imaging?"
      aria-label="Question"
    />

    <button id="search" type="button" disabled>
      Search
    </button>
  </div>

  <h2>Search Results</h2>

  <pre id="output">Results will appear here.</pre>

  <h2>RAG Context</h2>

  <pre id="context">Retrieved context will appear here.</pre>


  <script type="module">

    import {
      initializeCVRAG,
      searchCV,
      buildRAGContext,
      getCVRAGStatus,
    } from "./assets/js/cv-rag.js";


    // ---------------------------------------------------------
    // DOM elements
    // ---------------------------------------------------------

    const statusElement = document.querySelector("#status");
    const outputElement = document.querySelector("#output");
    const contextElement = document.querySelector("#context");
    const questionElement = document.querySelector("#question");
    const searchButton = document.querySelector("#search");


    // ---------------------------------------------------------
    // Progress handler
    // ---------------------------------------------------------

    const onProgress = (event) => {

      const message =
        event?.message ??
        event?.stage ??
        "Working...";

      statusElement.textContent = message;

      console.log("RAG progress:", event);
    };


    // ---------------------------------------------------------
    // Initialize RAG
    // ---------------------------------------------------------

    async function initialize() {

      searchButton.disabled = true;

      statusElement.textContent = "Initializing CV RAG...";

      try {

        await initializeCVRAG({
          onProgress,
        });


        // Get the real status object from cv-rag.js
        const ragStatus = getCVRAGStatus();

        console.log("RAG status:", ragStatus);


        if (
          ragStatus.initialized &&
          ragStatus.knowledgeLoaded &&
          ragStatus.indexLoaded
        ) {

          statusElement.textContent =
            `Ready: ${ragStatus.chunks} chunks. ` +
            `Knowledge base version: ${ragStatus.version}`;

          searchButton.disabled = false;

        } else {

          statusElement.textContent =
            "RAG initialization completed, but some components are not ready.";

        }

      } catch (error) {

        statusElement.textContent =
          `Initialization failed: ${error.message}`;

        console.error("RAG initialization error:", error);
      }
    }


    // ---------------------------------------------------------
    // Search
    // ---------------------------------------------------------

    async function runSearch() {

      const userQuestion = questionElement.value.trim();

      if (!userQuestion) {

        outputElement.textContent =
          "Please enter a question.";

        return;
      }


      searchButton.disabled = true;

      outputElement.textContent = "Searching...";
      contextElement.textContent = "Building context...";


      try {

        // Search the CV vector index
        const result = await searchCV(
          userQuestion,
          {
            topK: 5,
          }
        );


        console.log("Search result:", result);


        // Display the raw retrieval result
        outputElement.textContent =
          JSON.stringify(result, null, 2);


        // Build the context that will eventually be sent to Qwen
        if (result.hasRelevantContext) {

          const ragContext =
            buildRAGContext(result);

          contextElement.textContent =
            ragContext || "No context generated.";

          console.log("RAG context:", ragContext);

        } else {

          contextElement.textContent =
            "No sufficiently relevant information was found in the CV/portfolio knowledge base.";

        }


        const ragStatus = getCVRAGStatus();

        statusElement.textContent =
          `Ready: ${ragStatus.chunks} chunks. ` +
          `Best similarity score: ${
            typeof result.bestScore === "number"
              ? result.bestScore.toFixed(4)
              : "N/A"
          }`;

      } catch (error) {

        outputElement.textContent =
          `Search error: ${error.message}`;

        contextElement.textContent =
          "Context could not be generated.";

        console.error("CV search error:", error);

      } finally {

        searchButton.disabled = false;
      }
    }


    // ---------------------------------------------------------
    // Events
    // ---------------------------------------------------------

    searchButton.addEventListener(
      "click",
      runSearch
    );


    questionElement.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !searchButton.disabled
        ) {

          runSearch();
        }
      }
    );


    // ---------------------------------------------------------
    // Start
    // ---------------------------------------------------------

    initialize();

  </script>

</body>
</html>
